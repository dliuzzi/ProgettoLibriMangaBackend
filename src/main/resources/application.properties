spring.application.name=BackendLibriManga
logging.level.root=info
logging.level.com.betacom=debug

logging.file=./jpa.log
logging.pattern.console=  %d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\\(%F:%L\\) - %msg%n

server.port=8080


spring.datasource.url=jdbc:postgresql://localhost:5432/aggiornato
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.jpa.show-sql= false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=define.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=drop.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

lang=IT
app.upload.dir=./images

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail.sender}
spring.mail.password=${mail.password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Dimensione massima del file (es. 2 Megabyte)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Percorso dove verranno salvate le immagini sul tuo PC (crea una cartella chiamata 'uploads' nel progetto)
upload.path=uploads/